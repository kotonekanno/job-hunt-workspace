parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

get:
  description: 企業の基本情報、活動履歴、選考、文書、イベント、タスクを返す。
  tags:
    - Companies
  operationId: getCompanyById
  summary: 指定した企業の詳細を取得する
  responses:
    '200':
      description: 企業詳細の取得に成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/company.yaml#/GetCompanyResponse

patch:
  description: 指定した企業の名前または文書を更新する。更新する項目のみ指定する。
  tags:
    - Companies
  operationId: patchCompany
  summary: 企業情報を更新する
  requestBody:
    description: 企業情報の更新内容。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した企業を削除する。
  tags:
    - Companies
  operationId: DeleteCompanyById
  summary: 企業を削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
