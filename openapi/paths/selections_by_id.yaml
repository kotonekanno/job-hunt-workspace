# /companies/{companyId}/selections/{selectionId}
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/SelectionId

patch:
  description: 指定した選考を部分更新する。selectionStepsを指定した場合は、指定された配列で選考ステップ全体を置き換える。
  tags:
    - Selections
  operationId: patchSelection
  summary: 選考を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/UpdateSelectionRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

delete:
  description: 指定した選考を削除する。
  tags:
    - Selections
  operationId: deleteSelection
  summary: 選考を削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

post:
  description: 指定した選考の選考ステップを新規作成する。
  tags:
    - Selections
  operationId: createSelectionStep
  summary: 選考ステップの追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/CreateSelectionStepRequest
  responses:
    '201':
      description: 選考ステップの作成に成功。作成した選考ステップのIDと並び順を返す。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/selection.yaml#/CreateSelectionStepResponse
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
