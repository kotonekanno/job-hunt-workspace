# /documents

get:
  description: 文書一覧を返す。
  tags:
    - Documents
  operationId: getDocuments
  summary: 文書一覧を取得
  responses:
    '200':
      description: 文書一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/document.yaml#/GetDocumentsResponse
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

post:
  description: 文書を新規作成する。
  tags:
    - Documents
  operationId: createDocument
  summary: 文書を追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/document.yaml#/CreateDocumentRequest
  responses:
    '201':
      description: 文書の新規作成に成功。作成した文書のIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - documentId
            properties:
              documentId:
                description: 文書ID。
                type: integer
                format: int32
            example:
              documentId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
