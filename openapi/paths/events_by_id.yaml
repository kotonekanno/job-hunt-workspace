# /events/{eventId}
parameters:
  - $ref: ../components/parameters/path.yaml#/EventId

patch:
  description: 指定したイベントを部分更新する。
  tags:
    - Events
  operationId: patchEvent
  summary: イベントを部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/event.yaml#/UpdateEventRequest
        examples:
          updateEventNote:
            summary: メモを編集
            value:
              note: 事前に提出書類を確認する。
          unlinkCompany:
            summary: 関連する企業を削除
            value:
              companyId: null
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定したイベントを削除する。
  tags:
    - Events
  operationId: deleteEvent
  summary: イベントを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
