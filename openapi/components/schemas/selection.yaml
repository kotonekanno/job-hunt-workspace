# ====================
# Value Types
# ====================

SelectionTitle:
  description: 選考の名称
  type: string
  minLength: 1
  maxLength: 50

SelectionStepName:
  description: 現在の選考ステップ名
  type: string
  minLength: 1
  maxLength: 50

SelectionStatus:
  description: 選考状況（NOT_STARTED：未受験 / PENDING：結果待ち / PASSED：合格 / FAILED：不合格）
  type: string
  enum:
    - NOT_STARTED
    - PENDING
    - PASSED
    - FAILED
  minLength: 6
  maxLength: 11

SelectionStepNote:
  description: 選考ステップの詳細メモ
  type: string
  nullable: true
  minLength: 0
  maxLength: 2000


# ====================
# Models
# ====================

Selection:
  description: 選考情報（取得）
  type: object
  properties:
    id:
      description: 選考ID
      type: integer
      format: int32
    title:
      $ref: '#/SelectionTitle'
    steps:
      type: array
      items:
        $ref: '#/SelectionStepResponse'
    currentStepId:
      description: 選考ステップID
      type: integer
      format: int32
  required:
    - id
    - title
    - steps

SelectionStepRequest:
  description: 選考ステップ（作成）
  type: object
  properties:
    position:
      description: 選考ステップの順序
      type: integer
      format: int32
    name:
      $ref: '#/SelectionStepName'
    note:
      $ref: '#/SelectionStepNote'
  required:
    - position
    - name

SelectionStepResponse:
  description: 選考ステップ（取得）
  type: object
  properties:
    id:
      description: 選考ステップID
      type: integer
      format: int32
    position:
      description: 選考ステップの順序
      type: integer
      format: int32
    status:
      $ref: '#/SelectionStatus'
    name:
      $ref: '#/SelectionStepName'
    note:
      $ref: '#/SelectionStepNote'
  required:
    - id
    - position
    - status
    - name

CurrentSelection:
  description: 進行中の選考
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    step:
      $ref: '#/CurrentSelectionStep'
  nullable: true
  required:
    - title
    - step

CurrentSelectionStep:
  description: 現在の選考ステップ
  type: object
  properties:
    id:
      description: 選考ステップID
      type: integer
      format: int32
    name:
      $ref: '#/SelectionStepName'
    status:
      $ref: '#/SelectionStatus'
  required:
    - id
    - name
    - status


# ====================
# Request / Response
# ====================

CreateSelectionRequest:
  description: 新規選考の作成内容。
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    steps:
      description: 選考ステップ一覧
      type: array
      items:
        $ref: '#/SelectionStepRequest'
  required:
    - title
    - steps
  example:
    title: 本選考
    steps:
      - position: 1000
        name: 一次面接
        note: 事前に提出書類を確認する。

CreateSelectionResponse:
  description: 新規選考の作成結果。
  type: object
  properties:
    selectionId:
      description: 作成した選考のID
      type: integer
      format: int32
    selectionSteps:
      description: 作成した選考ステップの順序
      type: array
      items:
        $ref: '#/CreateSelectionStepResponse'
  required:
    - selectionId
    - selectionSteps
  example:
    selectionId: 1
    selectionSteps:
      - selectionId: 1
        position: 1000

UpdateSelectionRequest:
  description: 選考の部分更新内容。更新する項目のみ指定する。
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    selectionSteps:
      description: 指定した配列で選考ステップ全体を置き換える。各要素は作成時と同じ形式。空配列の場合は全ステップを削除し、項目を省略した場合は変更しない。stepNoは同じ選考内で一意
      type: array
      items:
        $ref: '#/CreateSelectionStepRequest'

CreateSelectionStepRequest:
  description: 新規選考ステップの作成内容。
  type: object
  properties:
    position:
      description: 選考ステップの順序
      type: integer
      format: int32
    name:
      $ref: '#/SelectionStepName'
    note:
      $ref: '#/SelectionStepNote'
  required:
    - position
    - name

CreateSelectionStepResponse:
  description: 作成した選考ステップの識別情報。
  type: object
  properties:
    selectionId:
      description: 選考ID
      type: integer
      format: int32
    position:
      description: 選考ステップの順序
      type: integer
      format: int32
  required:
    - selectionId
    - position
  example:
    selectionId: 1
    position: 1000

UpdateSelectionStepRequest:
  description: 選考ステップの部分更新内容。更新する項目のみ指定する。
  type: object
  properties:
    position:
      description: 選考ステップの順序
      type: integer
      format: int32
    name:
      $ref: '#/SelectionStepName'
    note:
      $ref: '#/SelectionStepNote'