# /essay-groups

get:
  description: ESグループ一覧を返す。
  tags:
    - Essays
  operationId: getEssayGroups
  summary: ESグループ一覧を取得
  responses:
    '200':
      description: ESグループ一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/essay.yaml#/GetEssayGroupsResponse
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

post:
  description: ESグループを新規作成する。
  tags:
    - Essays
  operationId: createEssayGroup
  summary: ESグループを追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/essay.yaml#/CreateEssayGroupRequest
  responses:
    '201':
      description: ESグループの新規作成に成功。作成したESグループのIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - essayGroupId
            properties:
              essayGroupId:
                description: ESグループID
                type: integer
                format: int32
            example:
              essayGroupId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '409':
      $ref: ../components/responses/common.yaml#/Conflict
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
