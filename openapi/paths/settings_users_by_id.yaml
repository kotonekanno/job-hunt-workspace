# /settings/users/{userId}
parameters:
  - $ref: ../components/parameters/path.yaml#/UserId

patch:
  description: 指定したユーザーの登録情報を部分更新する。
  tags:
    - Authentication
  operationId: patchUser
  summary: ユーザー情報を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/auth.yaml#/UpdateUserRequest
  responses:
    "204":
      $ref: ../components/responses/common.yaml#/NoContent
    "400":
      $ref: ../components/responses/common.yaml#/BadRequest
    "401":
      $ref: ../components/responses/common.yaml#/Unauthorized
    "403":
      $ref: ../components/responses/common.yaml#/Forbidden
    "404":
      $ref: ../components/responses/common.yaml#/NotFound
    "500":
      $ref: ../components/responses/common.yaml#/InternalServerError
