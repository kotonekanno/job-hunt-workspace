# /auth/login

post:
  description: メールアドレスとパスワードでログインする。アクセストークンを返し、リフレッシュトークンをHttpOnly Cookieに設定する。
  tags:
    - Authentication
  operationId: login
  summary: ログイン
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/auth.yaml#/AuthRequest
  responses:
    '200':
      description: ログインに成功。
      headers:
        Set-Cookie:
          description: refreshToken Cookieを設定する。Secure・SameSite・有効期間は環境設定に従う。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/AccessTokenResponse
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      description: パスワードが正しくない。
    '403':
      description: アカウントが未認証。
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
