# /companies/{companyId}/activities

parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

post:
  description: 指定した企業とのやりとり履歴を新規作成する。
  tags:
    - Activities
  operationId: createCompanyActivity
  summary: やりとり履歴を追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/CreateCompanyActivityRequest
  responses:
    '201':
      description: やりとり履歴の作成に成功。作成したやりとり履歴のIDを返す。
      content:
        application/json:
          schema:
            type: object
            properties:
              activityId:
                description: やりとり履歴ID
                type: integer
                format: int32
            required:
              - activityId
            example:
              activityId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
