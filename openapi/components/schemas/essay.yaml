# ====================
# Value Types
# ====================

EssayGroupName:
  description: ESグループ名
  type: string
  minLength: 1
  maxLength: 50

EssayQuestion:
  description: ESの設問
  type: string
  minLength: 1
  maxLength: 1000

EssayAnswer: 
  description: 設問に対する回答
  type: string
  minLength: 0
  maxLength: 5000


# ====================
# Models
# ====================

EssayGroupListItem:
  description: ESグループ一覧の1件分の情報
  type: object
  properties:
    id:
      description: ESグループID
      type: integer
      format: int32
    position:
      description: ESグループの表示順
      type: integer
      format: int32
    name:
      $ref: '#/EssayGroupName'
    quantity:
      description: ESグループに属するESの件数
      type: integer
      minimum: 0
  required:
    - id
    - position
    - name
    - quantity

Essay:
  description: ESの設問と回答
  type: object
  properties:
    id:
      description: ESのID
      type: integer
      format: int32
    companyName:
      $ref: ./company.yaml#/NullableCompanyName
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'
  required:
    - id
    - question
    - answer


# ====================
# Request / Response
# ====================

GetEssayGroupsResponse:
  description: ESグループ一覧の取得結果。
  type: object
  properties:
    essayGroups:
      description: ESグループ一覧（該当するグループがない場合は空配列）
      type: array
      items:
        $ref: '#/EssayGroupListItem'
  required:
    - essayGroups
  example:
    essayGroups:
      - id: 1
        position: 1000
        name: ガクチカ
        quantity: 1

CreateEssayGroupRequest:
  description: 新規ESグループの作成内容。
  type: object
  properties:
    name:
      $ref: '#/EssayGroupName'
  required:
    - name
  example:
    name: ガクチカ

GetEssaysResponse:
  description: 指定したESグループのES一覧の取得結果
  type: object
  properties:
    essays:
      description: ESの一覧（該当するESがない場合は空配列）
      type: array
      items:
        $ref: '#/Essay'
  required:
    - essays
  example:
    essays:
      - id: 1
        companyName: 株式会社サンプル
        question: 学生時代に力を入れたことを教えてください。
        answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。

CreateEssayRequest:
  description: 新規ESの作成内容。
  type: object
  properties:
    companyId:
      description: 関連する企業のID
      type: integer
      format: int32
      nullable: true
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'
  required:
    - question
    - answer
  example:
    companyId: 1
    question: 学生時代に力を入れたことを教えてください。
    answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。

UpdateEssayRequest:
  description: ESの設問と回答の部分更新内容。更新する項目のみ指定する。
  type: object
  properties:
    companyId:
      description: 関連する企業のID
      type: integer
      format: int32
      nullable: true
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'