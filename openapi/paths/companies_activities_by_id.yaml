# /companies/{companyId}/activities/{activityId}

parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/ActivityId

patch:
  description: 指定したやりとり履歴を部分更新する。
  tags:
    - Activities
  operationId: patchCompanyActivity
  summary: やりとり履歴を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyActivityRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

delete:
  description: 指定したやりとり履歴を削除する。
  tags:
    - Activities
  operationId: deleteCompanyActivity
  summary: やりとり履歴を削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
