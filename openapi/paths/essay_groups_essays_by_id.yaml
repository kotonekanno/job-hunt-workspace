# /essay-groups/{essayGroupId}/essays/{essayId}
parameters:
  - $ref: ../components/parameters/path.yaml#/EssayGroupId
  - $ref: ../components/parameters/path.yaml#/EssayId

patch:
  description: 指定したESを部分更新する。
  tags:
    - Essays
  operationId: patchEssay
  summary: ESを部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/essay.yaml#/UpdateEssayRequest
        examples:
          updateEssayAnswer:
            value:
              answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。
          unlinkCompany:
            value:
              companyId: null
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定したESを削除する。
  tags:
    - Essays
  operationId: deleteEssay
  summary: ESを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
