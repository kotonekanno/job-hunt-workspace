# /companies/{companyId}/selections/{selectionId}/steps/{stepId}
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/SelectionId
  - $ref: ../components/parameters/path.yaml#/SelectionStepId

patch:
  description: 指定した選考ステップの情報を部分更新する。位置を変更した場合、currentStepより前の
  tags:
    - Selections
  operationId: patchSelectionStep
  summary: 選考ステップを部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/UpdateSelectionStepRequest
        examples:
          reorderSteps:
            summary: 選考ステップの順序を更新
            value:
              position: 1500
          updateStep:
            summary: 選考ステップを更新
            value:
              name: 二次面接
              note: 事前に提出書類を確認する。
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した選考ステップを削除する。currentStepを削除した場合、その直後の選考ステップがcurrentStepとなる。
  tags:
    - Selections
  operationId: deleteSelectionStep
  summary: 選考ステップを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
