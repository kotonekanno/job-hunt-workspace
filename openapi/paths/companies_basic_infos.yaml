# /companies/{companyId}/basic_infos
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

post:
  description: 指定した企業の基本情報を新規作成する。
  tags:
    - BasicInfos
  operationId: createCompanyBasicInfo
  summary: 基本情報を追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/CreateCompanyBasicInfoRequest
  responses:
    '201':
      description: 基本情報の作成に成功。作成した基本情報のIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - basicInfoId
            properties:
              basicInfoId:
                description: 基本情報ID。
                type: integer
                format: int32
            example:
              basicInfoId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
