# /companies

get:
  description: 企業一覧を返す。
  tags:
    - Companies
  operationId: getCompanies
  summary: 企業一覧を取得
  responses:
    '200':
      description: 企業一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/company.yaml#/GetCompaniesResponse
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

post:
  description: 企業を新規作成する。
  tags:
    - Companies
  operationId: createCompany
  summary: 企業を追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/CreateCompanyRequest
  responses:
    '201':
      description: 企業の新規作成に成功。作成した企業のIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - companyId
            properties:
              companyId:
                description: 企業ID
                type: integer
                format: int32
            example:
              companyId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '409':
      $ref: ../components/responses/common.yaml#/Conflict
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
