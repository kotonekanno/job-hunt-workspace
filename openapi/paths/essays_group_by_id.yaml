parameters:
  - $ref: ../components/parameters/path.yaml#/EssayGroupId
  - $ref: ../components/parameters/path.yaml#/EssayId

patch:
  description: 指定した設問グループのESを部分更新する。
  tags:
    - Essays
  operationId: patchEssay
  summary: ESを更新する
  requestBody:
    description: 更新する項目のみ指定する。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/essay.yaml#/UpdateEssayRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した設問グループに属するESを削除する。
  tags:
    - Essays
  operationId: deleteEssay
  summary: ESを削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
