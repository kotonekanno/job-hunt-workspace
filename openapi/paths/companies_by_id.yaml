# /companies/{companyId}
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

get:
  description: 指定した企業の詳細情報を返す。
  tags:
    - Companies
  operationId: getCompanyById
  summary: 企業の詳細情報を取得
  responses:
    '200':
      description: 企業の詳細情報の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/company.yaml#/GetCompanyResponse

patch:
  description: 指定した企業の情報を部分更新する。
  tags:
    - Companies
  operationId: patchCompany
  summary: 企業情報を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した企業を削除する。
  tags:
    - Companies
  operationId: DeleteCompanyById
  summary: 企業を削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
