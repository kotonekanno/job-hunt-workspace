      required:
        - title
      example:
        title: 面接対策
    Document:
      description: 文書の内容
      type: object
      properties:
        title:
          $ref: '#/components/schemas/DocumentTitle'
        text:
          $ref: '#/components/schemas/DocumentText'
      required:
        - title
        - text
      example:
        title: 面接対策
        text: |-
          # 株式会社サンプル
          事業内容と志望理由を整理する。
    UpdateDocumentRequest:
      description: 文書の部分更新内容。更新する項目のみ指定する。
      type: object
      properties:
        title:
          $ref: '#/components/schemas/DocumentTitle'
        text:
          $ref: '#/components/schemas/DocumentText'
      example:
        title: 面接対策
    Email:
      description: メールアドレス
      type: string
      format: email
    Password:
      description: パスワード
      type: string
      format: password
      writeOnly: true
    AuthRequest:
      description: アカウント登録・ログインに使用する認証情報。
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
      required:
        - email
        - password
      example:
        email: user@example.com
        password: SamplePassword123!
    AccessToken:
      description: AuthorizationヘッダーにBearer形式で指定するアクセストークン
      type: string
    AccessTokenResponse:
      description: ログイン・アクセストークン更新の結果。リフレッシュトークンはレスポンスボディに含めない。
      type: object
      properties:
        accessToken:
          $ref: '#/components/schemas/AccessToken'
      required:
        - accessToken
      example:
        accessToken: example-access-token
  responses:
    Unauthorized:
      description: 認証が必要。アクセストークンが指定されていない、無効、または有効期限切れ。
    InternalServerError:
      description: サーバー内部で予期しないエラーが発生した。
    BadRequest:
      description: リクエストの形式または値が不正。
    Conflict:
      description: 登録済みのリソースと競合する。
    Forbidden:
      description: 指定したリソースに対する操作権限がない。
    NotFound:
      description: 指定したリソースまたは関連付け先のリソースが存在しない。
    NoContent:
      description: 処理に成功。レスポンスボディは返さない。
