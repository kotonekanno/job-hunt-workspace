parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/ActivityId

patch:
  description: 指定した活動履歴を部分更新する。
  tags:
    - Companies
  operationId: patchCompanyActivity
  summary: 企業の活動履歴を更新する
  requestBody:
    description: 更新する項目のみ指定する。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyActivityRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した企業の活動履歴を1件削除する。
  tags:
    - Companies
  operationId: deleteCompanyActivity
  summary: 企業の活動履歴を削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
