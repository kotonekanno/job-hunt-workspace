# ====================
# Value Types
# ====================

CompanyName:
  description: 企業名
  type: string
  minLength: 1
  maxLength: 50

NullableCompanyName:
  description: 関連する企業の名前（企業に紐付かない場合はnull）
  type: string
  nullable: true
  minLength: 1
  maxLength: 50

CompanyPriority:
  description: 志望度（0：未分類、1～5：第1～第5志望、6：アーカイブ）
  type: integer
  format: int32
  minimum: 0
  maximum: 6

BasicInfoTitle:
  description: 基本情報の項目名
  type: string
  minLength: 1
  maxLength: 50

BasicInfoText:
  description: 基本情報の内容
  type: string
  minLength: 0
  maxLength: 500

ActivityText:
  description: やりとりの内容
  type: string
  minLength: 1
  maxLength: 500


# ====================
# Models
# ====================

CompanyListItem:
  description: 企業一覧の1件分の情報
  type: object
  properties:
    id:
      description: 企業ID
      type: integer
      format: int32
    name:
      $ref: '#/CompanyName'
    priority:
      $ref: '#/CompanyPriority'
    position:
      description: 同じ志望度内での表示順
      type: integer
      format: int32
    currentSelection:
      $ref: ./selection.yaml#/CurrentSelection
  required:
    - id
    - name
    - priority
    - position
    - currentSelection

BasicInfo:
  description: 企業の基本情報の1項目
  type: object
  properties:
    id:
      description: 基本情報ID
      type: integer
      format: int32
    title:
      $ref: '#/BasicInfoTitle'
    text:
      $ref: '#/BasicInfoText'
  required:
    - id
    - title
    - text

Activity:
  description: 企業とのやりとり履歴の1件分の情報
  type: object
  properties:
    id:
      description: やりとり履歴ID
      type: integer
      format: int32
    occurredAt:
      description: やりとりが発生した日時
      type: string
      format: date-time
    byUser:
      description: ユーザー側からのやりとりの場合はtrue、企業側からの場合はfalse
      type: boolean
    text:
      $ref: '#/ActivityText'
  required:
    - id
    - occurredAt
    - text


# ====================
# Request / Response
# ====================

GetCompaniesResponse:
  description: 企業一覧の取得結果。
  type: object
  properties:
    companies:
      description: 企業一覧（該当する企業がない場合は空配列）
      type: array
      items:
        $ref: '#/CompanyListItem'
  required:
    - companies
  example:
    companies:
      - id: 1
        name: 株式会社サンプル
        priority: 3
        position: 1000
        currentSelection:
          title: 本選考
          step:
            id: 1
            name: 一次面接
            status: PENDING

CreateCompanyRequest:
  description: 企業の登録内容。
  type: object
  properties:
    name:
      $ref: '#/CompanyName'
    priority:
      $ref: '#/CompanyPriority'
  required:
    - name
    - priority
  example:
    name: 株式会社サンプル
    priority: 3

GetCompanyResponse:
  description: 企業の詳細情報。
  type: object
  properties:
    name:
      $ref: '#/CompanyName'
    showBasicInfoWidget:
      description: true：基本情報ウィジェットを表示 / false：非表示
      type: boolean
    showSelectionWidget:
      description: true：選考状況ウィジェットを表示 / false：非表示
      type: boolean
    basicInfos:
      description: 企業の基本情報（該当する情報がない場合は空配列）
      type: array
      items:
        $ref: '#/BasicInfo'
    activities:
      description: 企業とのやりとり履歴（該当する情報がない場合は空配列）
      type: array
      items:
        $ref: '#/Activity'
    selections:
      description: 企業の選考状況（該当する情報がない場合は空配列）
      type: array
      items:
        $ref: ./selection.yaml#/Selection
    activeSelectionId:
      description: 選考ID
      type: integer
      format: int32
      nullable: true
    document:
      $ref: ./document.yaml#/DocumentText
    events:
      description: 企業に関連する予定（該当する情報がない場合は空配列）
      type: array
      items:
        $ref: ./event.yaml#/Event
    tasks:
      description: 企業に関連するタスク一覧（該当する情報がない場合は空配列）
      type: array
      items:
        $ref: ./task.yaml#/Task
  required:
    - name
    - showBasicInfoWidget
    - showSelectionWidget
    - basicInfos
    - activities
    - selections
    - activeSelectionId
    - document
    - events
    - tasks
  example:
    name: 株式会社サンプル
    showBasicInfoWidget: true
    showSelectionWidget: true
    basicInfos:
      - id: 1
        title: 従業員数
        text: 200人
    activities:
      - id: 1
        occurredAt: 2026-10-15T10:00:00+09:00
        text: 説明会の案内を受け取った。
    selections:
      - id: 2
        title: インターン選考
        steps:
          - id: 1
            position: 1000
            status: PENDING
            name: 一次面接
            note: 事前に志望理由を整理する。
    activeSelectionId: 2
    document: '# 企業研究

      事業内容と志望理由を整理する。'
    events:
      - id: 1
        companyName: 株式会社サンプル
        category: SESSION
        title: 企業説明会
        note: 事前に提出書類を確認する。
        isAllDay: false
        startDay: null
        endDay: null
        startTime: 2026-10-15T10:00:00+09:00
        endTime: 2026-10-15T11:00:00+09:00
        isOnline: true
        isAttending: true
    tasks:
      - id: 1
        companyId: 1
        title: エントリーシートを提出する
        note: 事前に提出書類を確認する。
        deadline: 2026-10-15T18:00:00+09:00
        done: false

UpdateCompanyRequest:
  description: 企業の部分更新内容。
  type: object
  properties:
    name:
      $ref: '#/CompanyName'
  example:
    name: 株式会社サンプル

UpdateCompanyPriorityRequest:
  description: 企業の志望度・並び順の更新内容。前後の企業IDによって並び順を指定する。前後の企業IDを両方省略した場合は、指定した志望度の末尾に追加する。
  type: object
  properties:
    priority:
      $ref: '#/CompanyPriority'
    previousCompanyId:
      description: 移動後の前隣の企業のID（先頭に置く場合はnull）
      type: integer
      format: int32
      nullable: true
    nextCompanyId:
      description: 移動後の後ろ隣の企業のID（末尾に置く場合はnull）
      type: integer
      format: int32
      nullable: true
  required:
    - priority

UpdateCompanyWidgetRequest:
  description: 企業詳細画面のウィジェット表示設定。更新する項目のみ指定する。
  type: object
  properties:
    basicInfo:
      description: true：基本情報ウィジェットを表示 / false：非表示
      type: boolean
    selection:
      description: true：選考状況ウィジェットを表示 / false：非表示
      type: boolean

CreateCompanyBasicInfoRequest:
  description: 基本情報の登録内容
  type: object
  properties:
    title:
      $ref: '#/BasicInfoTitle'
    text:
      $ref: '#/BasicInfoText'
  required:
    - title
    - text
  example:
    title: 従業員数
    text: 200人

UpdateCompanyBasicInfoRequest:
  description: 基本情報の部分更新内容。省略した項目は変更しない。
  type: object
  properties:
    title:
      $ref: '#/BasicInfoTitle'
    text:
      $ref: '#/BasicInfoText'
  example:
    text: 300人

CreateCompanyActivityRequest:
  description: 新規やりとり履歴の作成内容。
  type: object
  properties:
    occurredAt:
      description: やりとりが発生した日時
      type: string
      format: date-time
    byUser:
      description: true：ユーザー側から / false：企業側から
      type: boolean
    text:
      $ref: '#/ActivityText'
  required:
    - occurredAt
    - byUser
    - text
  example:
    occurredAt: 2026-10-15T10:00:00+09:00
    byUser: true
    text: 説明会の案内を受け取った。

UpdateCompanyActivityRequest:
  description: やりとり履歴の部分更新内容。更新する項目のみ指定する。
  type: object
  properties:
    occurredAt:
      description: やりとりが発生した日時
      type: string
      format: date-time
    byUser:
      description: true：ユーザー側から / false：企業側から
      type: boolean
    text:
      $ref: '#/ActivityText'
  example:
    text: 説明会の案内を受け取った。
