parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/BasicInfoId

patch:
  description: 指定した基本情報の項目名または内容を部分更新する。
  tags:
    - Companies
  operationId: patchCompanyBasicInfo
  summary: 企業の基本情報を更新する
  requestBody:
    description: 更新する項目のみ指定する。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyBasicInfoRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した企業の基本情報を1項目削除する。
  tags:
    - Companies
  operationId: deleteCompanyBasicInfo
  summary: 企業の基本情報を削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
