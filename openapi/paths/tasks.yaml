# /tasks

get:
  description: タスク一覧を返す。
  tags:
    - Tasks
  operationId: getTasks
  summary: タスク一覧を取得
  responses:
    '200':
      description: タスク一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/task.yaml#/GetTaskResponse

post:
  description: タスクを新規作成する。
  tags:
    - Tasks
  operationId: createTask
  summary: タスクを追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/task.yaml#/CreateTaskRequest
  responses:
    '201':
      description: タスクの新規作成に成功。作成したタスクのIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - taskId
            properties:
              taskId:
                description: タスクID
                type: integer
                format: int32
            example:
              taskId: 1
