services:
  db:
    image: postgres:17
    container_name: job-hunt-workspace-db

    environment:
      POSTGRES_DB: job_hunt_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_hunt_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: job-hunt-workspace-backend

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/job_hunt_workspace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres-data: