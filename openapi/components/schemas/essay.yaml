# ====================
# Value Types
# ====================

EssayGroupName:
  description: 設問グループ名
  type: string
  minLength: 1
  maxLength: 50

EssayQuestion:
    description: ESの設問
    type: string
    minLength: 1
    maxLength: 1000
    example: 学生時代に力を入れたことを教えてください。

EssayAnswer: 
  description: 設問に対する回答
  type: string
  minLength: 0
  maxLength: 5000
  example: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。


# ====================
# Models
# ====================

EssayGroupListItem:
  description: ES設問グループ一覧の1件分の情報
  type: object
  properties:
    id:
      description: 設問グループID
      type: integer
      format: int32
    position:
      description: 設問グループの表示順
      type: integer
      format: int32
    name:
      $ref: '#/EssayGroupName'
    quantity:
      description: グループに属するESの件数
      type: integer
      minimum: 0
  required:
    - id
    - position
    - name
    - quantity
  example:
    id: 1
    position: 1000
    name: 学生時代に力を入れたこと
    quantity: 1

Essay:
  description: ESの設問と回答
  type: object
  properties:
    id:
      description: ESのID
      type: integer
      format: int32
      example: 1
    companyName:
      $ref: './company.yaml#/NullableCompanyName'
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'
  required:
    - id
    - question
    - answer
  example:
    id: 1
    companyName: サンプル株式会社
    question: 学生時代に力を入れたことを教えてください。
    answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。


# ====================
# Request / Response
# ====================

GetEssayGroupsResponse:
  description: ES設問グループ一覧の取得結果
  type: object
  properties:
    essayGroups:
      description: 設問グループの一覧。該当するグループがない場合は空配列
      type: array
      items:
        $ref: '#/EssayGroupListItem'
  required:
    - essayGroups
  example:
    essayGroups:
      - id: 1
        position: 1000
        name: 学生時代に力を入れたこと
        quantity: 1

CreateEssayGroupRequest:
  description: 新規ES設問グループの登録内容
  type: object
  properties:
    name:
      $ref: '#/EssayGroupName'
  required:
    - name
  example:
    name: 学生時代に力を入れたこと

GetEssaysResponse:
  description: 指定した設問グループのES一覧の取得結果
  type: object
  properties:
    essays:
      description: 設問グループに属するESの一覧。該当するESがない場合は空配列
      type: array
      items:
        $ref: '#/Essay'
  required:
    - essays
  example:
    essays:
      - id: 1
        companyName: 株式会社サンプル
        question: 学生時代に力を入れたことを教えてください。
        answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。

CreateEssayRequest:
  description: ESの設問と回答の登録内容
  type: object
  properties:
    companyId:
      description: 関連する企業のID
      type: integer
      format: int32
      nullable: true
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'
  required:
    - question
    - answer
  example:
    companyId: 1
    question: 学生時代に力を入れたことを教えてください。
    answer: 学内イベントの運営を担当し、参加者の満足度向上に取り組みました。

UpdateEssayRequest:
  description: ESの設問と回答の部分更新内容。省略した項目は変更しない
  type: object
  properties:
    companyId:
      description: 関連する企業のID
      type: integer
      format: int32
      nullable: true
    question:
      $ref: '#/EssayQuestion'
    answer:
      $ref: '#/EssayAnswer'
