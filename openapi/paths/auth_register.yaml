# /auth/register

post:
  description: アカウントを新規作成する。
  tags:
    - Authentication
  operationId: register
  summary: アカウントを登録
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/auth.yaml#/AuthRequest
  responses:
    '201':
      description: アカウントの新規作成に成功。作成したユーザーのIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - userId
            properties:
              userId:
                description: ユーザーID
                type: integer
                format: int32
            example:
              userId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '409':
      $ref: ../components/responses/common.yaml#/Conflict
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
