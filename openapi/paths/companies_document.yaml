# /companies/{companyId}/document
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

put:
  description: 指定した企業の文書を置き換える。
  tags:
    - Companies
  operationId: putCompanyDocument
  summary: 企業の文書を更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/document.yaml#/DocumentText'
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
