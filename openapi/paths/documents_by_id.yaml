# /documents/{documentId}
parameters:
  - $ref: ../components/parameters/path.yaml#/DocumentId

get:
  description: 指定した文書を返す。
  tags:
    - Documents
  operationId: getDocumentById
  summary: 文書を取得
  responses:
    '200':
      description: 文書の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/document.yaml#/Document
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

patch:
  description: 指定した文書のタイトルまたは本文を更新する。
  tags:
    - Documents
  operationId: patchDocument
  summary: 文書を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/document.yaml#/UpdateDocumentRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

delete:
  description: 指定した文書を削除する。
  tags:
    - Documents
  operationId: deleteDocument
  summary: 文書を削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
