            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: アカウントの新規作成に成功。作成したユーザーのIDを返す。
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                properties:
                  userId:
                    description: ユーザーID
                    type: integer
                    format: int32
                example:
                  userId: 1
        '400':
