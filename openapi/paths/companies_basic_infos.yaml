parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

post:
  description: 指定した企業の基本情報を1項目登録する。
  tags:
    - Companies
  operationId: createCompanyBasicInfo
  summary: 企業の基本情報を追加する
  requestBody:
    description: 登録内容。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/CreateCompanyBasicInfoRequest
  responses:
    '201':
      description: 作成に成功。
      content:
        application/json:
          schema:
            description: 作成したリソースの識別情報。
            type: object
            required:
              - basicInfoId
            properties:
              basicInfoId:
                description: 作成した基本情報のID。
                type: integer
                format: int32
            example:
              basicInfoId: 1
