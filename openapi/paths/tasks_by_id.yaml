# /tasks/{taskId}
parameters:
  - $ref: ../components/parameters/path.yaml#/TaskId

patch:
  description: 指定したタスクを部分更新する。
  tags:
    - Tasks
  operationId: patchTask
  summary: タスクを部分更新
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/task.yaml#/UpdateTaskRequest
        examples:
          updateTaskNote:
            summary: メモを更新
            value:
              note: 事前に提出書類を確認する。
          unlinkCompany:
            summary: 関連する企業を削除
            value:
              companyId: null
          deleteDeadline:
            summary: 期限を削除
            value:
              deadline: null
          checkDone:
            summary: タスクを完了
            value:
              done: true

    required: true
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定したタスクを削除する。
  tags:
    - Tasks
  operationId: deleteTask
  summary: タスクを削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
