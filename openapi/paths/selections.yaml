# /companies/{companyId}/selections
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

post:
  description: 指定した企業の選考を新規作成する。
  tags:
    - Selections
  operationId: createSelection
  summary: 選考を追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/CreateSelectionRequest
  responses:
    '201':
      description: 選考の新規作成に成功。作成した選考・選考ステップのIDおよび並び順を返す。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/selection.yaml#/CreateSelectionResponse
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
