# /companies/{companyId}/widgets
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

patch:
  description: 指定したウィジェットの表示／非表示を更新する。
  tags:
    - Companies
  operationId: patchCompanyWidgets
  summary: 企業のウィジェット表示設定を更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyWidgetRequest
        examples:
          showBasicInfoWidget:
            summary: 基本情報ウィジェットを表示
            value:
              basicInfo: true
          hideSelectionWidget:
            summary: 選考状況ウィジェットを非表示
            value:
              selection: false
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
