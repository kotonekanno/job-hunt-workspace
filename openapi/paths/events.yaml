# /events

get:
  description: 指定した年月のイベント一覧を返す。年月を省略した場合は現在の年月を対象とする。
  tags:
    - Events
  operationId: getEvents
  summary: イベント一覧を取得
  parameters:
    - $ref: ../components/parameters/query.yaml#/EventMonth
  responses:
    '200':
      description: イベント一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/event.yaml#/GetEventsResponse
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

post:
  description: イベントを新規作成する。
  tags:
    - Events
  operationId: createEvent
  summary: イベントを追加
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/event.yaml#/CreateEventRequest
  responses:
    '201':
      description: イベントの新規作成に成功。作成したイベントのIDを返す。
      content:
        application/json:
          schema:
            type: object
            required:
              - eventId
            properties:
              eventId:
                description: イベントID
                type: integer
                format: int32
            example:
              eventId: 1
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
