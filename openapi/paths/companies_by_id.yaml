# /companies/{companyId}
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId

get:
  description: 指定した企業の詳細情報を返す。
  tags:
    - Companies
  operationId: getCompanyById
  summary: 企業の詳細情報を取得
  responses:
    '200':
      description: 企業の詳細情報の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/company.yaml#/GetCompanyResponse
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

patch:
  description: 指定した企業の情報を部分更新する。
  tags:
    - Companies
  operationId: patchCompany
  summary: 企業情報を部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/company.yaml#/UpdateCompanyRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '409':
      $ref: ../components/responses/common.yaml#/Conflict
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

delete:
  description: 指定した企業を削除する。
  tags:
    - Companies
  operationId: DeleteCompanyById
  summary: 企業を削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
