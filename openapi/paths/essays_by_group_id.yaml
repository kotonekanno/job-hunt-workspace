parameters:
  - $ref: ../components/parameters/path.yaml#/EssayGroupId

get:
  description: 指定した設問グループに属するESの設問と回答を返す。
  tags:
    - Essays
  operationId: getEssaysByGroupId
  summary: ES設問グループの回答一覧を取得する
  responses:
    '200':
      description: ES一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/essay.yaml#/GetEssaysResponse

post:
  description: 指定した設問グループにESの設問と回答を登録する。
  tags:
    - Essays
  operationId: createEssay
  summary: ESを追加する
  requestBody:
    description: 登録内容。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/essay.yaml#/CreateEssayRequest
  responses:
    '201':
      description: 作成に成功。
      content:
        application/json:
          schema:
            description: 作成したリソースの識別情報。
            type: object
            required:
              - essayId
            properties:
              essayId:
                description: 作成したESのID。
                type: integer
                format: int32
            example:
              essayId: 1

delete:
  description: 指定した設問グループを削除する。ESが残っているグループはDBの参照制約により削除できない。
  tags:
    - Essays
  operationId: deleteEssayGroup
  summary: ESグループを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
