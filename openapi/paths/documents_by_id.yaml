parameters:
  - $ref: ../components/parameters/path.yaml#/DocumentId

get:
  description: 指定した文書のタイトルと本文を返す。
  tags:
    - Documents
  operationId: getDocumentById
  summary: 文書を取得する
  responses:
    '200':
      description: 文書の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/document.yaml#/Document

patch:
  description: 指定した文書のタイトルまたは本文を更新する。更新する項目のみ指定する。
  tags:
    - Documents
  operationId: patchDocument
  summary: 文書を更新する
  requestBody:
    description: 更新する項目のみ指定する。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/document.yaml#/UpdateDocumentRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した文書を削除する。
  tags:
    - Documents
  operationId: deleteDocument
  summary: 文書を削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
