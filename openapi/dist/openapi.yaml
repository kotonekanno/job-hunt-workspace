openapi: 3.0.4
info:
  title: 超・就活管理 API
  version: 0.1.0
servers:
  - description: ローカル開発環境
    url: http://localhost:8080
security:
  - BearerAuth: []
tags:
  - name: Companies
    description: 企業管理
  - name: Selections
    description: 企業の選考状況
  - name: BasicInfos
    description: 企業の基本情報
  - name: Activities
    description: 企業とのやりとり履歴
  - name: Events
    description: カレンダー
  - name: Tasks
    description: タスク
  - name: Essays
    description: ES蓄積
  - name: Documents
    description: ドキュメント
  - name: Authentication
    description: 認証
paths:
  /companies:
    get:
      description: 企業一覧を返す。
      tags:
        - Companies
      operationId: getCompanies
      summary: 企業一覧を取得
      responses:
        '200':
          description: 企業一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompaniesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: 企業を新規作成する。
      tags:
        - Companies
      operationId: createCompany
      summary: 企業を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: 企業の新規作成に成功。作成した企業のIDを返す。
          content:
            application/json:
              schema:
                type: object
                required:
                  - companyId
                properties:
                  companyId:
                    description: 企業ID
                    type: integer
                    format: int32
                example:
                  companyId: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      description: 指定した企業の詳細情報を返す。
      tags:
        - Companies
      operationId: getCompanyById
      summary: 企業の詳細情報を取得
      responses:
        '200':
          description: 企業の詳細情報の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      description: 指定した企業の情報を部分更新する。
      tags:
        - Companies
      operationId: patchCompany
      summary: 企業情報を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定した企業を削除する。
      tags:
        - Companies
      operationId: DeleteCompanyById
      summary: 企業を削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/priority:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    patch:
      description: 企業を指定した志望度・並び順へ移動する。
      tags:
        - Companies
      operationId: patchCompanyPriority
      summary: 企業の志望度・並び順を更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyPriorityRequest'
            examples:
              reorderInListView:
                summary: 企業一覧画面で更新
                value:
                  priority: 3
                  previousCompanyId: 1
                  nextCompanyId: 2
              moveToTop:
                summary: 志望度の先頭に移動
                value:
                  priority: 3
                  previousCompanyId: null
                  nextCompanyId: 2
              reorderInSingleView:
                summary: 企業詳細画面で更新
                value:
                  priority: 3
                  previousCompanyId: null
                  nextCompanyId: null
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/document:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      description: 指定した企業の文書を置き換える。
      tags:
        - Companies
      operationId: putCompanyDocument
      summary: 企業の文書を更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentText'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/basic_infos:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業の基本情報を新規作成する。
      tags:
        - BasicInfos
      operationId: createCompanyBasicInfo
      summary: 基本情報を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBasicInfoRequest'
      responses:
        '201':
          description: 基本情報の作成に成功。作成した基本情報のIDを返す。
          content:
            application/json:
              schema:
                type: object
                required:
                  - basicInfoId
                properties:
                  basicInfoId:
                    description: 基本情報ID。
                    type: integer
                    format: int32
                example:
                  basicInfoId: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/basic_infos/{basicInfoId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/BasicInfoId'
    patch:
      description: 指定した基本情報を部分更新する。
      tags:
        - BasicInfos
      operationId: patchCompanyBasicInfo
      summary: 基本情報を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBasicInfoRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定した基本情報を削除する。
      tags:
        - BasicInfos
      operationId: deleteCompanyBasicInfo
      summary: 基本情報を削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/activities:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業とのやりとり履歴を新規作成する。
      tags:
        - Activities
      operationId: createCompanyActivity
      summary: やりとり履歴を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyActivityRequest'
      responses:
        '201':
          description: やりとり履歴の作成に成功。作成したやりとり履歴のIDを返す。
          content:
            application/json:
              schema:
                type: object
                properties:
                  activityId:
                    description: やりとり履歴ID
                    type: integer
                    format: int32
                required:
                  - activityId
                example:
                  activityId: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ActivityId'
    patch:
      description: 指定したやりとり履歴を部分更新する。
      tags:
        - Activities
      operationId: patchCompanyActivity
      summary: やりとり履歴を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyActivityRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定したやりとり履歴を削除する。
      tags:
        - Activities
      operationId: deleteCompanyActivity
      summary: やりとり履歴を削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/selections:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業の選考を新規作成する。
      tags:
        - Selections
      operationId: createSelection
      summary: 選考を追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectionRequest'
      responses:
        '201':
          description: 選考の新規作成に成功。作成した選考・選考ステップのIDおよび並び順を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSelectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/selections/{selectionId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SelectionId'
    patch:
      description: 指定した選考を部分更新する。selectionStepsを指定した場合は、指定された配列で選考ステップ全体を置き換える。
      tags:
        - Selections
      operationId: patchSelection
      summary: 選考を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelectionRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定した選考を削除する。
      tags:
        - Selections
      operationId: deleteSelection
      summary: 選考を削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: 指定した選考の選考ステップを新規作成する。
      tags:
        - Selections
      operationId: createSelectionStep
      summary: 選考ステップの追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectionStepRequest'
      responses:
        '201':
          description: 選考ステップの作成に成功。作成した選考ステップのIDと並び順を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSelectionStepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/selections/{selectionId}/is-active:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SelectionId'
    put:
      description: 指定した選考が進行中かどうかを更新する。他の選考が進行中に設定されている場合、解除する。
      tags:
        - Selections
      operationId: putSelectionIsActive
      summary: 進行中の選考を更新
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  description: true：進行中の選考（一つの企業に対し一つのみ）
                  type: boolean
              required:
                - isActive
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/selections/{selectionId}/steps/{selectionStepId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SelectionId'
      - $ref: '#/components/parameters/SelectionStepId'
    patch:
      description: 指定した選考ステップの情報を部分更新する。位置を変更した場合、currentStepより前の選考ステップはPASSED、後の選考ステップはNOT_STARTEDとなる。
      tags:
        - Selections
      operationId: patchSelectionStep
      summary: 選考ステップを部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelectionStepRequest'
            examples:
              reorderSteps:
                summary: 選考ステップの順序を更新
                value:
                  position: 1500
              updateStep:
                summary: 選考ステップを更新
                value:
                  name: 二次面接
                  note: 事前に提出書類を確認する。
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定した選考ステップを削除する。currentStepを削除した場合、その直後の選考ステップがcurrentStepとなる。
      tags:
        - Selections
      operationId: deleteSelectionStep
      summary: 選考ステップを削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/selections/{selectionId}/steps/{selectionStepId}/status:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SelectionId'
      - $ref: '#/components/parameters/SelectionStepId'
    put:
      description: 指定した選考ステップの状態を更新する。これより前のステップの状態をすべてPASSED、後のステップの状態をすべてNOT_STARTEDに更新する。
      tags:
        - Selections
      operationId: putSelectionStepStatus
      summary: 選考ステップの状態を更新
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/SelectionStatus'
              required:
                - status
              example:
                status: NOT_STARTED
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /companies/{companyId}/widgets:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    patch:
      description: 指定したウィジェットの表示／非表示を更新する。
      tags:
        - Companies
      operationId: patchCompanyWidgets
      summary: 企業のウィジェット表示設定を更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyWidgetRequest'
            examples:
              showBasicInfoWidget:
                summary: 基本情報ウィジェットを表示
                value:
                  basicInfo: true
              hideSelectionWidget:
                summary: 選考状況ウィジェットを非表示
                value:
                  selection: false
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events:
    get:
      description: 指定した年月のイベント一覧を返す。年月を省略した場合は現在の年月を対象とする。
      tags:
        - Events
      operationId: getEvents
      summary: イベント一覧を取得
      parameters:
        - $ref: '#/components/parameters/EventMonth'
      responses:
        '200':
          description: イベント一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: イベントを新規作成する。
      tags:
        - Events
      operationId: createEvent
      summary: イベントを追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: イベントの新規作成に成功。作成したイベントのIDを返す。
          content:
            application/json:
              schema:
                type: object
                required:
                  - eventId
                properties:
                  eventId:
                    description: イベントID
                    type: integer
                    format: int32
                example:
                  eventId: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      description: 指定したイベントを部分更新する。
      tags:
        - Events
      operationId: patchEvent
      summary: イベントを部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
            examples:
              updateEventNote:
                summary: メモを編集
                value:
                  note: 事前に提出書類を確認する。
              unlinkCompany:
                summary: 関連する企業を削除
                value:
                  companyId: null
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 指定したイベントを削除する。
      tags:
        - Events
      operationId: deleteEvent
      summary: イベントを削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
