# /companies/{companyId}/selections/{selectionId}/steps/{selectionStepId}
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/SelectionId
  - $ref: ../components/parameters/path.yaml#/SelectionStepId

patch:
  description: 指定した選考ステップの情報を部分更新する。
  tags:
    - Selections
  operationId: patchSelectionStep
  summary: 選考ステップを部分更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/UpdateSelectionStepRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError

delete:
  description: 指定した選考ステップを削除する。currentStepを削除した場合、その直後の選考ステップがcurrentStepとなる。
  tags:
    - Selections
  operationId: deleteSelectionStep
  summary: 選考ステップを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
