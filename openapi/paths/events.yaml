get:
  description: 指定した年月のイベント一覧を返す。年月を省略した場合は現在の年月を対象とする。
  tags:
    - Events
  operationId: getEvents
  summary: 指定した月の予定を取得する
  parameters:
    - $ref: ../components/parameters/query.yaml#/EventMonth
  responses:
    '200':
      description: 取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/event.yaml#/GetEventsResponse

post:
  description: イベントを登録し、作成したイベントのIDを返す。
  tags:
    - Events
  operationId: createEvent
  summary: イベントを作成する
  requestBody:
    description: 登録内容。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/event.yaml#/CreateEventRequest
  responses:
    '201':
      description: 作成に成功。
      content:
        application/json:
          schema:
            description: 作成したリソースの識別情報。
            type: object
            required:
              - eventId
            properties:
              eventId:
                description: 作成したイベントのID。
                type: integer
                format: int32
            example:
              eventId: 1
