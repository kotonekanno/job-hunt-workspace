parameters:
  - $ref: ../components/parameters/path.yaml#/TaskId

patch:
  description: 指定したタスクを部分更新する。
  tags:
    - Tasks
  operationId: patchTask
  summary: タスクを更新する
  requestBody:
    description: 更新内容。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/task.yaml#/UpdateTaskRequest
    required: true
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定したタスクを削除する。
  tags:
    - Tasks
  operationId: deleteTask
  summary: タスクを削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
