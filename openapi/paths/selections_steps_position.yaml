# /companies/{companyId}/selections/{selectionId}/steps/{selectionStepId}/position
parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/SelectionId
  - $ref: ../components/parameters/path.yaml#/SelectionStepId

put:
  description: 選考ステップの並び順を更新する。currentStepより前の選考ステップはPASSED、後の選考ステップはNOT_STARTEDとなる。
  tags:
    - Selections
  operationId: reorderSelectionStep
  summary: 選考ステップの並び順を更新
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            nextSelectionStepId:
              description: 移動先の1個後ろの選考ステップのID（null：末尾に移動）
              type: integer
              format: int32
              nullable: true
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../components/responses/common.yaml#/NotFound
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
