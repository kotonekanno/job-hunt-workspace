openapi: 3.0.4
info:
  title: 超・就活管理 API
  version: 0.1.0
servers:
  - description: ローカル開発環境
    url: http://localhost:8080
security:
  - BearerAuth: []
tags:
  - description: 企業管理API
    name: Companies
  - description: 選考状況API
    name: Selections
  - description: カレンダーAPI
    name: Events
  - description: タスクAPI
    name: Tasks
  - description: ES管理API
    name: Essays
  - description: ドキュメントAPI
    name: Documents
paths:
  /companies:
    get:
      description: 企業名、志望度、表示順と現在の選考状況を返す。
      tags:
        - Companies
      operationId: getCompanies
      summary: 企業一覧を取得する
      responses:
        '200':
          description: 企業一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompaniesResponse'
    post:
      description: 企業名と志望度を登録し、作成した企業のIDを返す。
      tags:
        - Companies
      operationId: createCompany
      summary: 企業を新規作成する
      requestBody:
        description: 作成する企業の内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: 企業の新規作成に成功
          content:
            application/json:
              schema:
                description: リクエストまたはレスポンスのデータ。
                type: object
                required:
                  - companyId
                properties:
                  companyId:
                    description: 作成した企業のID。
                    type: integer
                    format: int32
                example:
                  companyId: 1
  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      description: 企業の基本情報、活動履歴、選考、文書、イベント、タスクを返す。
      tags:
        - Companies
      operationId: getCompanyById
      summary: 指定した企業の詳細を取得する
      responses:
        '200':
          description: 企業詳細の取得に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyResponse'
    patch:
      description: 指定した企業の名前または文書を更新する。更新する項目のみ指定する。
      tags:
        - Companies
      operationId: patchCompany
      summary: 企業情報を更新する
      requestBody:
        description: 企業情報の更新内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した企業を削除する。
      tags:
        - Companies
      operationId: DeleteCompanyById
      summary: 企業を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/priority:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    patch:
      description: 指定した志望度内の、前後の企業IDで示した位置へ移動する。前後のIDを両方省略した場合は末尾に追加する。
      tags:
        - Companies
      operationId: patchCompanyPriority
      summary: 企業の志望度と並び順を更新する
      requestBody:
        description: 更新内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyPriorityRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/document:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      description: 指定した企業のMarkdown形式の文書を置き換える。
      tags:
        - Companies
      operationId: putCompanyDocument
      summary: 企業文書を更新する
      requestBody:
        description: 更新後の企業文書。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentText'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した企業の文書を削除する。
      tags:
        - Companies
      operationId: deleteCompanyDocument
      summary: 企業文書を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/basic_infos:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業の基本情報を1項目登録する。
      tags:
        - Companies
      operationId: createCompanyBasicInfo
      summary: 企業の基本情報を追加する
      requestBody:
        description: 登録内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBasicInfoRequest'
      responses:
        '201':
          description: 作成に成功。
          content:
            application/json:
              schema:
                description: 作成したリソースの識別情報。
                type: object
                required:
                  - basicInfoId
                properties:
                  basicInfoId:
                    description: 作成した基本情報のID。
                    type: integer
                    format: int32
                example:
                  basicInfoId: 1
  /companies/{companyId}/basic_infos/{basicInfoId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/BasicInfoId'
    patch:
      description: 指定した基本情報の項目名または内容を部分更新する。
      tags:
        - Companies
      operationId: patchCompanyBasicInfo
      summary: 企業の基本情報を更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBasicInfoRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した企業の基本情報を1項目削除する。
      tags:
        - Companies
      operationId: deleteCompanyBasicInfo
      summary: 企業の基本情報を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/activities:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業とのやり取りを登録する。企業ごとに複数件登録できる。
      tags:
        - Companies
      operationId: createCompanyActivity
      summary: 企業の活動履歴を追加する
      requestBody:
        description: 登録内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyActivityRequest'
      responses:
        '201':
          description: 作成に成功。
          content:
            application/json:
              schema:
                description: 作成したリソースの識別情報。
                type: object
                required:
                  - activityId
                properties:
                  activityId:
                    description: 作成した活動履歴のID。
                    type: integer
                    format: int32
                example:
                  activityId: 1
  /companies/{companyId}/activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ActivityId'
    patch:
      description: 指定した活動履歴を部分更新する。
      tags:
        - Companies
      operationId: patchCompanyActivity
      summary: 企業の活動履歴を更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyActivityRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した企業の活動履歴を1件削除する。
      tags:
        - Companies
      operationId: deleteCompanyActivity
      summary: 企業の活動履歴を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/selections:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      description: 指定した企業の選考と選考ステップを登録する。
      tags:
        - Selections
      operationId: createSelection
      summary: 企業の選考を作成する
      requestBody:
        description: 登録内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectionRequest'
      responses:
        '201':
          description: 作成に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSelectionResponse'
  /companies/{companyId}/selections/{selectionId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SelectionId'
    patch:
      description: 指定した選考を部分更新する。省略した項目は変更しない。selectionStepsを指定した場合は、指定された配列で選考ステップ全体を置き換える。
      tags:
        - Selections
      operationId: patchSelection
      summary: 企業の選考を更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelectionRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した選考と、その選考に属する選考ステップを削除する。
      tags:
        - Selections
      operationId: deleteSelection
      summary: 企業の選考を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /companies/{companyId}/widgets:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    patch:
      description: 指定したウィジェットの表示・非表示を更新する。
      tags:
        - Companies
      operationId: patchCompanyWidgets
      summary: 企業のウィジェット表示設定を更新する
      requestBody:
        description: 更新するウィジェットの表示設定。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyWidgetRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /events:
    get:
      description: 指定した年月のイベント一覧を返す。年月を省略した場合は現在の年月を対象とする。
      tags:
        - Events
      operationId: getEvents
      summary: 指定した月の予定を取得する
      parameters:
        - $ref: '#/components/parameters/EventMonth'
      responses:
        '200':
          description: 取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventsResponse'
    post:
      description: イベントを登録し、作成したイベントのIDを返す。
      tags:
        - Events
      operationId: createEvent
      summary: イベントを作成する
      requestBody:
        description: 登録内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 作成に成功。
          content:
            application/json:
              schema:
                description: 作成したリソースの識別情報。
                type: object
                required:
                  - eventId
                properties:
                  eventId:
                    description: 作成したイベントのID。
                    type: integer
                    format: int32
                example:
                  eventId: 1
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      description: 指定したイベントを部分更新する。日付や日時の整合性は更新後のイベント全体で確認する。
      tags:
        - Events
      operationId: patchEvent
      summary: イベントを更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定したイベントを削除する。
      tags:
        - Events
      operationId: deleteEvent
      summary: イベントを削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /tasks:
    get:
      description: 登録されているタスクの一覧を返す。
      tags:
        - Tasks
      operationId: getTasks
      summary: タスク一覧を取得する
      responses:
        '200':
          description: タスク一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskResponse'
    post:
      description: タスクを登録し、作成したタスクのIDを返す。
      tags:
        - Tasks
      operationId: createTask
      summary: タスクを新規作成する
      requestBody:
        description: 作成するタスクの内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: タスクの作成に成功。
          content:
            application/json:
              schema:
                description: リクエストまたはレスポンスのデータ。
                type: object
                required:
                  - taskId
                properties:
                  taskId:
                    description: 作成したタスクのID。
                    type: integer
                    format: int32
                example:
                  taskId: 1
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      description: 指定したタスクを部分更新する。
      tags:
        - Tasks
      operationId: patchTask
      summary: タスクを更新する
      requestBody:
        description: 更新内容。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定したタスクを削除する。
      tags:
        - Tasks
      operationId: deleteTask
      summary: タスクを削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /essays:
    get:
      description: 設問グループの表示順と、各グループに属するESの件数を返す。
      tags:
        - Essays
      operationId: getEssayGroups
      summary: ES設問グループ一覧を取得する
      responses:
        '200':
          description: ES設問グループ一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEssayGroupsResponse'
    post:
      description: ESの設問グループを登録し、作成したグループのIDを返す。
      tags:
        - Essays
      operationId: createEssayGroup
      summary: ESグループを作成
      requestBody:
        description: 作成する設問グループの内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEssayGroupRequest'
      responses:
        '201':
          description: ES設問グループの作成に成功。
          content:
            application/json:
              schema:
                description: リクエストまたはレスポンスのデータ。
                type: object
                required:
                  - essayGroupId
                properties:
                  essayGroupId:
                    description: 作成した設問グループのID。
                    type: integer
                    format: int32
                example:
                  essayGroupId: 1
  /essays/{essayGroupId}:
    parameters:
      - $ref: '#/components/parameters/EssayGroupId'
    get:
      description: 指定した設問グループに属するESの設問と回答を返す。
      tags:
        - Essays
      operationId: getEssaysByGroupId
      summary: ES設問グループの回答一覧を取得する
      responses:
        '200':
          description: ES一覧の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEssaysResponse'
    post:
      description: 指定した設問グループにESの設問と回答を登録する。
      tags:
        - Essays
      operationId: createEssay
      summary: ESを追加する
      requestBody:
        description: 登録内容。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEssayRequest'
      responses:
        '201':
          description: 作成に成功。
          content:
            application/json:
              schema:
                description: 作成したリソースの識別情報。
                type: object
                required:
                  - essayId
                properties:
                  essayId:
                    description: 作成したESのID。
                    type: integer
                    format: int32
                example:
                  essayId: 1
    delete:
      description: 指定した設問グループを削除する。ESが残っているグループはDBの参照制約により削除できない。
      tags:
        - Essays
      operationId: deleteEssayGroup
      summary: ESグループを削除
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /essays/{essayGroupId}/{essayId}:
    parameters:
      - $ref: '#/components/parameters/EssayGroupId'
      - $ref: '#/components/parameters/EssayId'
    patch:
      description: 指定した設問グループのESを部分更新する。
      tags:
        - Essays
      operationId: patchEssay
      summary: ESを更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEssayRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した設問グループに属するESを削除する。
      tags:
        - Essays
      operationId: deleteEssay
      summary: ESを削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /documents:
    get:
      description: 登録されている文書のID、表示順、タイトルを返す。
      tags:
        - Documents
      operationId: getDocuments
      summary: 文書一覧を取得する
      responses:
        '200':
          description: 取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentsResponse'
    post:
      description: 文書を登録し、作成した文書のIDを返す。
      tags:
        - Documents
      operationId: createDocument
      summary: 文書を新規作成する
      requestBody:
        description: 作成する文書のタイトル。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: 文書の作成に成功。
          content:
            application/json:
              schema:
                description: リクエストまたはレスポンスのデータ。
                type: object
                required:
                  - documentId
                properties:
                  documentId:
                    description: 作成した文書のID。
                    type: integer
                    format: int32
                example:
                  documentId: 1
  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      description: 指定した文書のタイトルと本文を返す。
      tags:
        - Documents
      operationId: getDocumentById
      summary: 文書を取得する
      responses:
        '200':
          description: 文書の取得に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
    patch:
      description: 指定した文書のタイトルまたは本文を更新する。更新する項目のみ指定する。
      tags:
        - Documents
      operationId: patchDocument
      summary: 文書を更新する
      requestBody:
        description: 更新する項目のみ指定する。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
    delete:
      description: 指定した文書を削除する。
      tags:
        - Documents
      operationId: deleteDocument
      summary: 文書を削除する
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
components:
  securitySchemes:
    BearerAuth:
      description: AuthorizationヘッダーにBearer形式のアクセストークンを指定する。対象の全APIで必須。
      type: http
      scheme: bearer
  schemas:
    CompanyName:
      description: 企業名
      type: string
      minLength: 1
      maxLength: 50
      example: 株式会社サンプル
    CompanyPriority:
      description: 志望度。0は未分類、1～5は第1～第5志望、6はアーカイブ。
      type: integer
      format: int32
      minimum: 0
      maximum: 6
      example: 3
    SelectionTitle:
      description: 選考の名称
      type: string
      minLength: 1
      maxLength: 50
      example: 本選考
    SelectionStepName:
      description: 現在の選考ステップ名
      type: string
      minLength: 1
      maxLength: 50
      example: 最終面接
    SelectionStatus:
      description: 選考状況。NOT_STARTEDは未受験、PENDINGは結果待ち、PASSEDは合格、FAILEDは不合格
      type: string
      enum:
        - NOT_STARTED
        - PENDING
        - PASSED
        - FAILED
      minLength: 6
      maxLength: 11
    CurrentSelection:
      description: 現在の選考状況。該当する選考状況がない場合はnull
      type: object
      properties:
        title:
          $ref: '#/components/schemas/SelectionTitle'
        step:
          $ref: '#/components/schemas/SelectionStepName'
        status:
          $ref: '#/components/schemas/SelectionStatus'
      nullable: true
      required:
        - title
        - step
        - status
      example:
        title: 本選考
        step: 最終面接
        status: NOT_STARTED
    CompanyListItem:
      description: 企業一覧の1件分の情報
      type: object
      properties:
        id:
          description: 企業ID
          type: integer
          format: int32
        name:
          $ref: '#/components/schemas/CompanyName'
        priority:
          $ref: '#/components/schemas/CompanyPriority'
        position:
          description: 同じ志望度内での表示順
          type: integer
          format: int32
        currentSelection:
          $ref: '#/components/schemas/CurrentSelection'
      required:
        - id
        - name
        - priority
        - position
        - currentSelection
      example:
        id: 1
        name: 株式会社サンプル
        priority: 3
        position: 1000
        currentSelection:
          title: 本選考
          step: 最終面接
          status: NOT_STARTED
    GetCompaniesResponse:
      description: 企業一覧の取得結果
      type: object
      properties:
        companies:
          description: 企業の一覧。該当する企業がない場合は空配列
          type: array
          items:
            $ref: '#/components/schemas/CompanyListItem'
      required:
        - companies
      example:
        companies:
          - id: 1
            name: 株式会社サンプル
            priority: 3
            position: 1000
            currentSelection:
              title: 本選考
              step: 最終面接
              status: NOT_STARTED
    CreateCompanyRequest:
      description: 新規企業の登録内容
      type: object
      properties:
        name:
