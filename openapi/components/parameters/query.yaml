EventMonth:
  description: 取得対象の年月（YYYY-MM）。省略した場合は現在の年月。
  name: month
  in: query
  required: false
  schema:
    type: string
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    minLength: 7
    maxLength: 7
  example: 2026-10

PageNumber:
  description: ページ番号（0始まり）。省略した場合は0。
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 0
    default: 0

Quantity:
  description: 一度に取得する数。省略した場合は全件。
  name: quantity
  in: query
  required: false
  schema:
    type: integer
    minimum: 1

QueryCompanyId:
  description: 紐づく企業のID。省略した場合は企業で絞らない。
  name: companyId
  in: query
  required: false
  schema:
    type: integer
    format: int32
