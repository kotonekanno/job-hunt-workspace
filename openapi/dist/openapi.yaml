          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      description: メールアドレスとパスワードでログインする。アクセストークンを返し、リフレッシュトークンをHttpOnly Cookieに設定する。
      tags:
        - Authentication
      operationId: login
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: ログインに成功。
          headers:
            Set-Cookie:
              description: refreshToken Cookieを設定する。Secure・SameSite・有効期間は環境設定に従う。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: パスワードが正しくない。
        '403':
          description: アカウントが未認証。
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      description: リフレッシュトークンのCookieを削除してログアウトする。クライアントは保持しているアクセストークンも破棄する。発行済みのトークン自体は失効しない。
      tags:
        - Authentication
      operationId: logout
      summary: ログアウト
      responses:
        '204':
          description: ログアウトに成功。レスポンスボディは返さない。
          headers:
            Set-Cookie:
              description: refreshToken Cookieを空にし、Max-Age=0で削除する。Secure・SameSiteは環境設定に従う。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      description: refreshToken Cookieを使用してアクセストークンを再発行する。リフレッシュトークンは更新しない。
      tags:
        - Authentication
      operationId: refresh
      summary: アクセストークンを更新
      security:
        - RefreshTokenAuth: []
      responses:
        '200':
          description: アクセストークンの再発行に成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: リフレッシュトークンが指定されていない、無効、または有効期限切れ。
        '404':
          description: ユーザーが存在しない、またはアカウントが未認証。
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      description: アクセストークンによる認証状態を確認する。ユーザー情報は返さない。
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: 認証状態を確認
      responses:
        '200':
          description: 認証状態の確認に成功。レスポンスボディは返さない。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      description: AuthorizationヘッダーにBearer形式のアクセストークンを指定する。
      type: http
      scheme: bearer
    RefreshTokenAuth:
      description: ログイン時に設定されるHttpOnly Cookieのリフレッシュトークンを使用する。
      type: apiKey
      in: cookie
      name: refreshToken
  schemas:
    CompanyName:
      description: 企業名
      type: string
      minLength: 1
      maxLength: 50
    CompanyPriority:
      description: 志望度（0：未分類、1～5：第1～第5志望、6：アーカイブ）
      type: integer
      format: int32
      minimum: 0
      maximum: 6
    SelectionTitle:
      description: 選考の名称
      type: string
      minLength: 1
      maxLength: 50
    SelectionStepName:
      description: 現在の選考ステップ名
      type: string
      minLength: 1
      maxLength: 50
    SelectionStatus:
      description: 選考状況（NOT_STARTED：未受験 / PENDING：結果待ち / PASSED：合格 / FAILED：不合格）
      type: string
      enum:
        - NOT_STARTED
        - PENDING
        - PASSED
        - FAILED
      minLength: 6
      maxLength: 11
    CurrentSelectionStep:
      description: 現在の選考ステップ
      type: object
      properties:
        id:
          description: 選考ステップID
          type: integer
          format: int32
        name:
          $ref: '#/components/schemas/SelectionStepName'
        status:
          $ref: '#/components/schemas/SelectionStatus'
      required:
        - id
        - name
        - status
    CurrentSelection:
      description: 進行中の選考
      type: object
      properties:
        title:
          $ref: '#/components/schemas/SelectionTitle'
        step:
          $ref: '#/components/schemas/CurrentSelectionStep'
      nullable: true
      required:
        - title
        - step
    CompanyListItem:
      description: 企業一覧の1件分の情報
      type: object
      properties:
        id:
          description: 企業ID
          type: integer
          format: int32
        name:
          $ref: '#/components/schemas/CompanyName'
        priority:
          $ref: '#/components/schemas/CompanyPriority'
        position:
          description: 同じ志望度内での表示順
          type: integer
          format: int32
        currentSelection:
          $ref: '#/components/schemas/CurrentSelection'
      required:
        - id
        - name
        - priority
        - position
        - currentSelection
    GetCompaniesResponse:
      description: 企業一覧の取得結果。
      type: object
      properties:
        companies:
          description: 企業一覧（該当する企業がない場合は空配列）
          type: array
          items:
            $ref: '#/components/schemas/CompanyListItem'
      required:
        - companies
      example:
        companies:
          - id: 1
            name: 株式会社サンプル
            priority: 3
            position: 1000
            currentSelection:
              title: 本選考
              step:
                id: 1
                name: 一次面接
                status: PENDING
    CreateCompanyRequest:
      description: 企業の登録内容。
      type: object
      properties:
        name:
          $ref: '#/components/schemas/CompanyName'
        priority:
          $ref: '#/components/schemas/CompanyPriority'
      required:
        - name
        - priority
      example:
        name: 株式会社サンプル
        priority: 3
    BasicInfoTitle:
      description: 基本情報の項目名
      type: string
      minLength: 1
      maxLength: 50
    BasicInfoText:
      description: 基本情報の内容
      type: string
      minLength: 0
      maxLength: 500
    BasicInfo:
      description: 企業の基本情報の1項目
      type: object
      properties:
        id:
          description: 基本情報ID
          type: integer
          format: int32
        title:
          $ref: '#/components/schemas/BasicInfoTitle'
        text:
          $ref: '#/components/schemas/BasicInfoText'
      required:
        - id
        - title
        - text
    ActivityText:
      description: やりとりの内容
      type: string
      minLength: 1
      maxLength: 500
    Activity:
      description: 企業とのやりとり履歴の1件分の情報
      type: object
      properties:
        id:
          description: やりとり履歴ID
          type: integer
          format: int32
        occurredAt:
          description: やりとりが発生した日時
          type: string
          format: date-time
        byUser:
          description: ユーザー側からのやりとりの場合はtrue、企業側からの場合はfalse
          type: boolean
        text:
          $ref: '#/components/schemas/ActivityText'
      required:
        - id
        - occurredAt
        - text
    SelectionStepNote:
      description: 選考ステップの詳細メモ
      type: string
      nullable: true
      minLength: 0
      maxLength: 2000
    SelectionStepResponse:
      description: 選考ステップ（取得）
      type: object
      properties:
        id:
          description: 選考ステップID
          type: integer
          format: int32
        position:
          description: 選考ステップの順序
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/SelectionStatus'
        name:
          $ref: '#/components/schemas/SelectionStepName'
        note:
          $ref: '#/components/schemas/SelectionStepNote'
      required:
        - id
        - position
        - status
        - name
    Selection:
      description: 選考情報（取得）
      type: object
      properties:
        id:
          description: 選考ID
          type: integer
          format: int32
        title:
          $ref: '#/components/schemas/SelectionTitle'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SelectionStepResponse'
        currentStepId:
          description: 選考ステップID
          type: integer
          format: int32
      required:
        - id
        - title
        - steps
    DocumentText:
      description: Markdown形式の文書
      type: string
      minLength: 0
      maxLength: 50000
    NullableCompanyName:
      description: 関連する企業の名前（企業に紐付かない場合はnull）
      type: string
      nullable: true
      minLength: 1
      maxLength: 50
    EventCategory:
      description: イベントの種類。SESSIONは説明会、CHATはカジュアル面談、INTERVIEWは面接、INTERNSHIPはインターン、OTHERはその他
      type: string
      enum:
        - SESSION
        - INTERVIEW
        - CHAT
        - INTERNSHIP
        - OTHER
      minLength: 4
      maxLength: 10
