# /auth/me

get:
  description: アクセストークンによる認証状態を確認する。
  tags:
    - Authentication
  operationId: getCurrentUser
  summary: 認証状態を確認
  responses:
    '200':
      description: 認証状態の確認に成功。メールアドレスを返す。
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                $ref: ../components/schemas/auth.yaml#/Email
            required:
              - email
            example:
              email: test@example.com
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '500':
      $ref: ../components/responses/common.yaml#/InternalServerError
