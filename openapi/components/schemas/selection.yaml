# ====================
# Value Types
# ====================

SelectionTitle:
  description: 選考の名称
  type: string
  minLength: 1
  maxLength: 50
  example: 本選考

SelectionStepName:
  description: 現在の選考ステップ名
  type: string
  minLength: 1
  maxLength: 50
  example: 最終面接

SelectionStatus:
  description: 選考状況。NOT_STARTEDは未受験、PENDINGは結果待ち、PASSEDは合格、FAILEDは不合格
  type: string
  enum:
    - NOT_STARTED
    - PENDING
    - PASSED
    - FAILED
  minLength: 6
  maxLength: 11

SelectionStepNo:
  description: 選考ステップの順序。同じ選考内で一意
  type: integer
  format: int32
  minimum: 1
  maximum: 50

SelectionStepNote:
  description: 選考ステップの詳細メモ
  type: string
  nullable: true
  minLength: 0
  maxLength: 2000
  example: 事前に提出書類を確認する。


# ====================
# Models
# ====================

CurrentSelection:
  description: 現在の選考状況。該当する選考状況がない場合はnull
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    step:
      $ref: '#/SelectionStepName'
    status:
      $ref: '#/SelectionStatus'
  nullable: true
  required:
    - title
    - step
    - status
  example:
    title: 本選考
    step: 最終面接
    status: NOT_STARTED

Selection:
  description: 企業の選考情報
  type: object
  properties:
    id:
      description: 選考ID
      type: integer
      format: int32
    title:
      $ref: '#/SelectionTitle'
    isActive:
      description: 進行中の選考の場合はtrue。同じ企業で進行中にできる選考は1件のみ
      type: boolean
  required:
    - id
    - title
    - isActive
  example:
    id: 1
    title: 本選考
    isActive: true


# ====================
# Request / Response
# ====================

CreateSelectionRequest:
  description: 選考と選考ステップの登録内容
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    selectionSteps:
      description: 登録する選考ステップ
      type: array
      items:
        $ref: '#/CreateSelectionStepRequest'
  required:
    - title
    - selectionSteps
  example:
    title: 本選考
    selectionSteps:
      - stepNo: 1
        name: 一次面接
        heldAt: '2026-10-15T10:00:00+09:00'
        note: 事前に提出書類を確認する。
        status: NOT_STARTED

CreateSelectionResponse:
  description: 選考の作成結果
  type: object
  properties:
    selectionId:
      description: 作成した選考のID
      type: integer
      format: int32
    isActive:
      description: 作成した選考が進行中の場合はtrue
      type: boolean
    selectionSteps:
      description: 作成した選考ステップの識別情報
      type: array
      items:
        $ref: '#/CreateSelectionStepResponse'
  required:
    - selectionId
    - isActive
    - selectionSteps
  example:
    selectionId: 1
    isActive: true
    selectionSteps:
      - selectionId: 1
        stepNo: 1

CreateSelectionStepRequest:
  description: 選考ステップの登録内容
  type: object
  properties:
    stepNo:
      $ref: '#/SelectionStepNo'
    name:
      $ref: '#/SelectionStepName'
    heldAt:
      description: 開催日時。タイムゾーン情報を含む日時
      type: string
      format: date-time
      nullable: true
    note:
      $ref: '#/SelectionStepNote'
    status:
      description: 選考状況。省略時はNOT_STARTED
      allOf:
        - $ref: '#/SelectionStatus'
      default: NOT_STARTED
  required:
    - stepNo
    - name
  example:
    stepNo: 1
    name: 一次面接
    heldAt: '2026-10-15T10:00:00+09:00'
    note: 事前に提出書類を確認する。
    status: NOT_STARTED

CreateSelectionStepResponse:
  description: 作成した選考ステップの識別情報。selectionIdとstepNoの組でステップを特定する
  type: object
  properties:
    selectionId:
      description: 選考ID
      type: integer
      format: int32
      example: 1
    stepNo:
      $ref: '#/SelectionStepNo'
  required:
    - selectionId
    - stepNo
  example:
    selectionId: 1
    stepNo: 1

UpdateSelectionRequest:
  description: 選考の部分更新内容。省略した項目は変更しない
  type: object
  properties:
    title:
      $ref: '#/SelectionTitle'
    selectionSteps:
      description: 指定した配列で選考ステップ全体を置き換える。各要素は作成時と同じ形式。空配列の場合は全ステップを削除し、項目を省略した場合は変更しない。stepNoは同じ選考内で一意
      type: array
      items:
        $ref: '#/CreateSelectionStepRequest'
