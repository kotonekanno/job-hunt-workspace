# /essay-groups/{essayGroupId}
parameters:
  - $ref: ../components/parameters/path.yaml#/EssayGroupId

get:
  description: 指定したESグループのES一覧を返す。
  tags:
    - Essays
  operationId: getEssaysByGroupId
  summary: ES一覧を取得
  responses:
    '200':
      description: ES一覧の取得に成功。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/essay.yaml#/GetEssaysResponse

delete:
  description: 指定したESグループを削除する。属するESは未分類へ移動する。
  tags:
    - Essays
  operationId: deleteEssayGroup
  summary: ESグループを削除
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
