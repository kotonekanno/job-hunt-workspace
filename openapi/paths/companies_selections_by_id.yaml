parameters:
  - $ref: ../components/parameters/path.yaml#/CompanyId
  - $ref: ../components/parameters/path.yaml#/SelectionId

patch:
  description: 指定した選考を部分更新する。省略した項目は変更しない。selectionStepsを指定した場合は、指定された配列で選考ステップ全体を置き換える。
  tags:
    - Selections
  operationId: patchSelection
  summary: 企業の選考を更新する
  requestBody:
    description: 更新する項目のみ指定する。
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/selection.yaml#/UpdateSelectionRequest
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent

delete:
  description: 指定した選考と、その選考に属する選考ステップを削除する。
  tags:
    - Selections
  operationId: deleteSelection
  summary: 企業の選考を削除する
  responses:
    '204':
      $ref: ../components/responses/common.yaml#/NoContent
